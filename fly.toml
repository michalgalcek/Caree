# Fly.io – EU region (Frankfurt) to keep shop data in the EU.
app = "caree-housee"
primary_region = "fra"

[build]

[env]
  PUBLIC_URL = "https://caree.housee.sk"
  NODE_ENV = "production"
  COMPANY_NAME = "housee s.r.o."
  COMPANY_ADDRESS = "Ovčiarsko 210, 010 04 Ovčiarsko, Slovakia; registered in the Business Register of the District Court Žilina, section Sro, file 71188/L"
  COMPANY_ID = "52059022 (VAT ID SK2120875449)"
  SUPPORT_EMAIL = "housee@housee.sk"
  PRIVACY_EMAIL = "housee@housee.sk"
  DEMO_SEED = "1"
  DEMO_EMAIL = "demo@garagee.test"
  REVIEW_EMAIL = "review@garagee.test"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "caree_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
